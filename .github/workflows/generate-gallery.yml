name: Auto Generate Gallery Data

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Photos/**'
      - 'Videos/**'
      - 'Video/**'
      - '.github/workflows/generate-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-gallery-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Subfolders and Build gallery-data.json
        run: |
          python -c "
          import os
          import json

          IMAGE_EXTS = {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.svg'}
          VIDEO_EXTS = {'.mp4', '.webm', '.mov', '.mkv'}

          base_dirs = ['Photos', 'Videos', 'Video']
          albums = {}
          media_items = []

          def clean_title(text):
              return text.replace('_', ' ').replace('-', ' ').title()

          for base in base_dirs:
              if not os.path.exists(base):
                  continue

              for root, dirs, files in os.walk(base):
                  rel_path = os.path.relpath(root, '.').replace('\\\\', '/')
                  parts = [p for p in rel_path.split('/') if p]

                  # Exclude root directory standalone files if needed; focus on folders
                  if len(parts) == 1:
                      album_id = parts[0].lower()
                      album_title = clean_title(parts[0])
                  else:
                      album_id = parts[1].lower().replace(' ', '-').replace('_', '-')
                      album_title = clean_title(parts[1])

                  # Initialize album if not present
                  if album_id not in albums:
                      albums[album_id] = {
                          'id': album_id,
                          'title': album_title,
                          'cover': '',
                          'count': 0
                      }

                  for file in sorted(files):
                      ext = os.path.splitext(file)[1].lower()
                      if ext in IMAGE_EXTS or ext in VIDEO_EXTS:
                          full_path = f'{rel_path}/{file}'
                          media_type = 'image' if ext in IMAGE_EXTS else 'video'

                          # Set first media item as album cover if empty
                          if not albums[album_id]['cover']:
                              albums[album_id]['cover'] = full_path

                          albums[album_id]['count'] += 1

                          media_items.append({
                              'src': full_path,
                              'name': clean_title(os.path.splitext(file)[0]),
                              'album': album_id,
                              'type': media_type
                          })

          # Only include albums with content
          active_albums = [album for album in albums.values() if album['count'] > 0]

          data = {
              'albums': active_albums,
              'media': media_items
          }

          with open('gallery-data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f'Generated gallery-data.json with {len(active_albums)} albums and {len(media_items)} items.')
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: scan subfolders & update gallery-data.json [skip ci]" && git push)
