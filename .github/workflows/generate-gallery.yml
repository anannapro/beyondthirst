name: Auto-Generate Gallery JSON

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is named master
    paths:
      - 'photos/**'

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Sub-folders & Generate gallery.json
        run: |
          python -c "
          import os, json

          PHOTO_DIR = 'photos'
          SUPPORTED_EXTS = ('.jpg', '.jpeg', '.png', '.gif', '.webp', '.avif')
          gallery = {}

          if os.path.exists(PHOTO_DIR):
              for album_name in sorted(os.listdir(PHOTO_DIR)):
                  album_path = os.path.join(PHOTO_DIR, album_name)
                  if os.path.isdir(album_path):
                      images = []
                      for root, _, files in os.walk(album_path):
                          for f in sorted(files):
                              if f.lower().endswith(SUPPORTED_EXTS):
                                  # Format path for HTML web fetching
                                  rel_path = os.path.relpath(os.path.join(root, f), '.')
                                  images.append(rel_path.replace('\\', '/'))
                      if images:
                          gallery[album_name] = images

          with open('gallery.json', 'w') as f:
              json.dump(gallery, f, indent=2)
          "

      - name: Commit and Push Updated gallery.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update gallery.json with new albums/photos"
          file_pattern: 'gallery.json'
