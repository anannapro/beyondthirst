name: Generate Gallery JSON

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

permissions:
  contents: write # Grants permission to commit gallery.json back to your repo

jobs:
  build-gallery-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan media folders and update gallery.json
        run: |
          python -c "
          import os, json

          # Supported extensions
          IMAGE_EXTS = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'}
          VIDEO_EXTS = {'.mp4', '.webm', '.mov'}

          gallery_items = []

          # Recursively scan all subfolders
          for root, dirs, files in os.walk('.'):
              # Skip hidden folders like .git and .github
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              
              for file in files:
                  ext = os.path.splitext(file)[1].lower()
                  # Normalizing file paths for web usage (forward slashes)
                  rel_path = os.path.relpath(os.path.join(root, file), '.').replace('\\\\', '/')
                  
                  # Ignore files sitting directly in root directory; focus on subfolder media
                  if '/' in rel_path:
                      if ext in IMAGE_EXTS:
                          gallery_items.append({'src': rel_path, 'type': 'image', 'title': file})
                      elif ext in VIDEO_EXTS:
                          gallery_items.append({'src': rel_path, 'type': 'video', 'title': file})

          # Write out to gallery.json
          with open('gallery.json', 'w') as f:
              json.dump(gallery_items, f, indent=2)

          print(f'Successfully updated gallery.json with {len(gallery_items)} items.')
          "

      - name: Commit and push gallery.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update gallery.json with latest media assets"
          file_pattern: "gallery.json"
